<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointage Horaire - Interface Employé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pointage-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .employee-select {
            background: white;
            cursor: pointer;
        }

        .password-input {
            margin-top: 15px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-entree {
            background: #28a745;
            color: white;
        }

        .btn-entree:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-sortie {
            background: #dc3545;
            color: white;
        }

        .btn-sortie:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .current-time {
            font-size: 1.2rem;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .admin-link {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e1e5e9;
        }

        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            color: #667eea;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="pointage-container">
        <div class="logo">🕐</div>
        <h1>Pointage Horaire</h1>
        
        <div class="current-time" id="currentTime"></div>
        
        <form id="pointageForm">
            <div class="form-group">
                <label for="employeeSelect">Sélectionnez votre nom :</label>
                <select id="employeeSelect" class="employee-select" required>
                    <option value="">Chargement des employés...</option>
                </select>
            </div>
            
            <div class="form-group password-input">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" placeholder="Votre mot de passe" required>
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-entree" onclick="pointage('entree')">
                    ✅ Entrée
                </button>
                <button type="button" class="btn btn-sortie" onclick="pointage('sortie')">
                    ❌ Sortie
                </button>
            </div>
        </form>
        
        <div id="status" class="status" style="display: none;"></div>
        <div id="loading" class="loading">Traitement en cours...</div>
        
        <div class="admin-link">
            <a href="/">Interface d'administration</a>
        </div>
    </div>

    <script>
        // Mettre à jour l'heure en temps réel
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('fr-FR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('currentTime').textContent = timeString;
        }

        // Charger la liste des employés
        async function loadEmployees() {
            try {
                const response = await fetch('/api/employees/list');
                const data = await response.json();
                
                const select = document.getElementById('employeeSelect');
                select.innerHTML = '<option value="">Sélectionnez votre nom</option>';
                
                if (data.employees && data.employees.length > 0) {
                    data.employees.forEach(emp => {
                        const option = document.createElement('option');
                        option.value = emp.employee_number;
                        option.textContent = emp.full_display;
                        select.appendChild(option);
                    });
                } else {
                    select.innerHTML = '<option value="">Aucun employé trouvé</option>';
                }
            } catch (error) {
                console.error('Erreur lors du chargement des employés:', error);
                const select = document.getElementById('employeeSelect');
                select.innerHTML = '<option value="">Erreur de chargement</option>';
            }
        }

        // Fonction de pointage
        async function pointage(type) {
            const employeeNumber = document.getElementById('employeeSelect').value;
            const password = document.getElementById('password').value;
            
            if (!employeeNumber) {
                showStatus('Veuillez sélectionner votre nom', 'error');
                return;
            }
            
            if (!password) {
                showStatus('Veuillez saisir votre mot de passe', 'error');
                return;
            }
            
            // Désactiver les boutons et afficher le loading
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.disabled = true);
            document.getElementById('loading').style.display = 'block';
            
            try {
                // D'abord se connecter
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        employee_number: employeeNumber,
                        password: password
                    })
                });
                
                const loginData = await loginResponse.json();
                
                if (!loginResponse.ok) {
                    throw new Error(loginData.error || 'Erreur de connexion');
                }
                
                // Ensuite effectuer le pointage
                const pointageResponse = await fetch('/api/timeentries', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        type: type
                    })
                });
                
                const pointageData = await pointageResponse.json();
                
                if (pointageResponse.ok) {
                    const typeText = type === 'entree' ? 'Entrée' : 'Sortie';
                    const time = new Date().toLocaleTimeString('fr-FR');
                    showStatus(`${typeText} enregistrée avec succès à ${time}`, 'success');
                    
                    // Vider le mot de passe pour la sécurité
                    document.getElementById('password').value = '';
                } else {
                    throw new Error(pointageData.error || 'Erreur lors du pointage');
                }
                
            } catch (error) {
                console.error('Erreur:', error);
                showStatus(error.message, 'error');
            } finally {
                // Réactiver les boutons et masquer le loading
                buttons.forEach(btn => btn.disabled = false);
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Afficher un message de statut
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            
            // Masquer le message après 5 secondes
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 1000);
            loadEmployees();
            
            // Permettre la soumission avec Entrée
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    pointage('entree');
                }
            });
        });
    </script>
</body>
</html>
